name: Auth API checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Auth
        uses: actions/checkout@v4
        with:
          path: auth

      - name: Check out shared database package
        uses: actions/checkout@v4
        with:
          repository: kajugadaniels/mucyora-db-v2
          path: db

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            auth/package-lock.json
            db/package-lock.json

      - name: Install and build shared database package
        working-directory: db
        run: |
          npm ci
          npm run build

      - name: Install Auth dependencies
        working-directory: auth
        run: npm ci

      - name: Run project boundary check
        working-directory: auth
        run: npm run check:boundary

      - name: Verify API contract
        working-directory: auth
        run: npm run check:api-contract

      - name: Run lint
        working-directory: auth
        run: npm run lint:check

      - name: Build
        working-directory: auth
        run: npm run build

      - name: Run unit tests
        working-directory: auth
        run: npm test -- --runInBand

      - name: Run end-to-end tests
        working-directory: auth
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://mucyora_auth_app:placeholder@localhost:5432/mucyora
        run: npm run test:e2e -- --runInBand

      - name: Reject high or critical dependency vulnerabilities
        working-directory: auth
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        working-directory: auth
        run: npm sbom --sbom-format cyclonedx > auth-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: auth-cyclonedx-sbom
          path: auth/auth-sbom.cdx.json
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Auth with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Auth
        uses: actions/checkout@v4
        with:
          path: auth

      - name: Check out shared database package
        uses: actions/checkout@v4
        with:
          repository: kajugadaniels/mucyora-db-v2
          path: db

      - name: Build release candidate image
        run: docker build --file auth/Dockerfile --tag mucyora-auth:scan .

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mucyora-auth:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload container scan result
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
