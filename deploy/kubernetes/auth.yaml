apiVersion: apps/v1
kind: Deployment
metadata:
  name: mucyora-auth
  labels:
    app.kubernetes.io/name: mucyora-auth
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mucyora-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mucyora-auth
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: mucyora-auth@sha256:REPLACE_WITH_APPROVED_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: mucyora-auth-config
            - secretRef:
                name: mucyora-auth-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: mucyora-auth
spec:
  selector:
    app.kubernetes.io/name: mucyora-auth
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mucyora-auth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mucyora-auth
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mucyora-auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mucyora-auth
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mucyora-auth-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mucyora-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              mucyora.network/ingress: allowed
      ports:
        - protocol: TCP
          port: 3000
